# SimpleOPDS — three services: postgres, api, ui
#
# Configure via a .env file next to this one (see .env.example):
#   SOPDS_BOOKS_DIR   host folder that holds your e-book collection  (default ./books)
#   SOPDS_PGDATA      postgres data location: a named volume or a host path
#                                                            (default named volume "sopds-pgdata")
#   SOPDS_UI_PORT     host port for the web UI                        (default 8080)
#   SOPDS_OPDS_PORT   host port for the raw API / OPDS feed           (default 8000)
#   POSTGRES_PASSWORD database password                               (default sopds)

services:
  postgres:
    # Built from postgres:16-alpine + the schema, applied by Liquibase at
    # build time and baked into the image (see server/Dockerfile.postgres).
    build:
      context: ./server
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sopds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sopds}
      POSTGRES_DB: ${POSTGRES_DB:-sopds}
    volumes:
      - "/mnt/data/portainer_nb/volumes/ebooks/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sopds} -d ${POSTGRES_DB:-sopds}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    cpus: 16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-sopds}
      PGPASSWORD: ${POSTGRES_PASSWORD:-sopds}
      PGDATABASE: ${POSTGRES_DB:-sopds}
      SOPDS_ROOT_LIB: /books
      SOPDS_ADMIN_TOKEN: ${SOPDS_ADMIN_TOKEN:-}
      SOPDS_TITLE: ${SOPDS_TITLE:-SimpleOPDS Catalog}
      SOPDS_SUBTITLE: ${SOPDS_SUBTITLE:-Powered by Node + React}
    volumes:
      # The e-book collection. Change SOPDS_BOOKS_DIR to point anywhere on the host.
      - "/mnt/tor/torrentstwo/books:/books:ro"
      # Persist the on-disk conversion cache between restarts.
      - sopds-convert-cache:/app/data
    ports:
      # Exposed so OPDS reader apps can hit the feed directly at :8000/opds/
      - "${SOPDS_OPDS_PORT:-8000}:8000"
    healthcheck:
      # /health also pings the database, so "healthy" means ready to serve.
      # Node (not wget) and 127.0.0.1 (not "localhost", which can resolve to ::1
      # in the container while the server binds IPv4).
      test:
        ["CMD", "node", "-e",
         "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    # A catalog *client*, not a service the catalog depends on (see
    # CONTEXT.md "Telegram bot") - behind the "bot" profile so a plain
    # `docker compose up` never starts it. `docker compose --profile bot up bot`
    # brings it up once TELEGRAM_BOT_TOKEN is set in .env.
    profiles: ["bot"]
    build:
      context: ./bot
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Not `${VAR:?message}`: Compose interpolates every service's env block
      # up front regardless of which profiles are active, so a required-var
      # check here would break a plain `docker compose up` too. Left unset,
      # the bot's own startup (config.ts) refuses to run and says why.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      SOPDS_API_URL: http://api:8000

  ui:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SOPDS_UI_PORT:-8989}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sopds-pgdata:
  sopds-convert-cache:
