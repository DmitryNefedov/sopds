# nginx config for the SimpleOPDS UI container.
# Serves the built React app and proxies API / OPDS traffic to the `api` service.

upstream sopds_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets with a long cache; index.html is always revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API, OPDS feed, health and debug endpoints -> API container.
    location /api/    { proxy_pass http://sopds_api; }
    location /opds    { proxy_pass http://sopds_api; }
    location /opds/   { proxy_pass http://sopds_api; }
    location /debug   { proxy_pass http://sopds_api; }
    location /debug/  { proxy_pass http://sopds_api; }
    location /healthz { proxy_pass http://sopds_api; }

    # SPA fallback: any other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    client_max_body_size 50m;
}
